name: Generate and Compare SBOM with cdxgen

on:
  # Trigger the workflow on push to the main branch and on manual dispatch
  push:
    branches:
      - main
  workflow_dispatch:

# Define permissions for the token
permissions:
  contents: read
  packages: write # Needed if you decide to upload the SBOM to GitHub Packages (optional)
  actions: write # Needed to upload artifacts

env:
  # Set the path for storing and retrieving the SBOM artifact
  SBOM_ARTIFACT_NAME: dependency-sbom
  SBOM_FILE_NAME: bom.cdx.json

jobs:
  generate_and_compare_sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Step 1: Download Previous SBOM (if available) ---
      - name: Download previous SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SBOM_ARTIFACT_NAME }}
          path: ./sbom_old
        continue-on-error: true # It's okay if this fails on the very first run

      # --- Step 2: Install cdxgen (using pip, common for Python-based tools) ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install cdxgen
        run: pip install cdxgen

      # --- Step 3: Generate New SBOM ---
      - name: Generate New SBOM
        id: generate_sbom
        # You might need to add specific build/scan arguments here based on your project type.
        # Example for a generic/mixed project:
        run: cdxgen --output ${{ env.SBOM_FILE_NAME }}
        
      # --- Step 4: Compare SBOMs ---
      - name: Compare New SBOM with Old SBOM
        id: compare_sbom
        # Check if the old SBOM file was downloaded successfully
        if: steps.download_artifact.outcome == 'success' || steps.download_artifact.outcome == 'skipped'
        run: |
          OLD_SBOM_PATH="./sbom_old/${{ env.SBOM_FILE_NAME }}"
          NEW_SBOM_PATH="./${{ env.SBOM_FILE_NAME }}"
          
          if [ -f "$OLD_SBOM_PATH" ]; then
            echo "Comparing new SBOM (${NEW_SBOM_PATH}) with old SBOM (${OLD_SBOM_PATH})..."
            
            # Use cdxgen to compare. The '--compare' flag outputs differences.
            # We use '--fail-on-diff' to make the step fail if any difference is found.
            cdxgen --compare "$OLD_SBOM_PATH" --fail-on-diff
            
            # If the above command succeeds (no failure), report success
            echo "SBOM comparison successful. No breaking changes detected."
          else
            echo "No previous SBOM found for comparison. Skipping comparison step."
          fi
        env:
          # Set the environment variable needed by cdxgen to identify the old file path
          OLD_SBOM_PATH: ./sbom_old/${{ env.SBOM_FILE_NAME }}


      # --- Step 5: Upload the Newly Generated SBOM as an Artifact ---
      - name: Upload New SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SBOM_ARTIFACT_NAME }}
          path: ${{ env.SBOM_FILE_NAME }}
          retention-days: 90 # Keep artifacts for 90 days
